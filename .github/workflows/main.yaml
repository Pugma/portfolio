name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_LOCKED: "1"
  MISE_LOCKED_VERIFY_PROVENANCE: "1"

jobs:
  fetch-deps:
    name: Fetch dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Get pnpm cache directories
        id: pnpm-paths
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm caches
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-paths.outputs.store }}
            ${{ steps.pnpm-paths.outputs.metadata }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-workspace.yaml', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-
      - name: Fetch dependencies
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm fetch
      - name: Save pnpm caches
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-paths.outputs.store }}
            ${{ steps.pnpm-paths.outputs.metadata }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

  check:
    name: Check
    needs:
      - fetch-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Get pnpm cache directories
        id: pnpm-paths
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-paths.outputs.store }}
            ${{ steps.pnpm-paths.outputs.metadata }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-workspace.yaml', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Install dependencies
        run: pnpm install --offline --frozen-lockfile
      - parallel:
          - name: Check Cloudflare types
            run: pnpm exec wrangler types --check
          - name: Run check
            run: pnpm check

  build:
    name: Build
    needs:
      - fetch-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Get pnpm cache directories
        id: pnpm-paths
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-paths.outputs.store }}
            ${{ steps.pnpm-paths.outputs.metadata }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('mise.toml', 'pnpm-workspace.yaml', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Install dependencies
        run: pnpm install --offline --frozen-lockfile
      - name: Run deploy dry run
        run: pnpm deploy:dry-run
      - name: Upload Lighthouse site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-site
          path: dist/client/
          if-no-files-found: error

  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: smartphone
            lhci_config: ./.lighthouserc.yaml
          - profile: tablet
            lhci_config: ./.lighthouserc.tablet.yaml
          - profile: desktop
            lhci_config: ./.lighthouserc.desktop.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Download Lighthouse site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lighthouse-site
          path: dist/client/
      - name: Run Lighthouse healthcheck
        run: >-
          lhci healthcheck
          --config=${{ matrix.lhci_config }}
          --fatal
      - name: Collect Lighthouse reports
        id: lighthouse_collect
        run: >-
          lhci collect
          --config=${{ matrix.lhci_config }}
      - name: Assert Lighthouse results
        if: ${{ steps.lighthouse_collect.outcome == 'success' }}
        run: >-
          lhci assert
          --config=${{ matrix.lhci_config }}
      - name: Export Lighthouse reports
        if: ${{ !cancelled() && steps.lighthouse_collect.outcome != 'skipped' }}
        run: >-
          lhci upload
          --config=${{ matrix.lhci_config }}
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() && steps.lighthouse_collect.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports-${{ matrix.profile }}
          path: lighthouse-reports/${{ matrix.profile }}/
          if-no-files-found: error
